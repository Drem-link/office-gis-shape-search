apiVersion: v1
kind: Namespace
metadata:
  name: office-gis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: office-gis
  namespace: office-gis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: office-gis
  template:
    metadata:
      labels:
        app: office-gis
    spec:
      containers:
        - name: office-gis
          image: ghcr.io/Drem-link/office-gis:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: office-gis
  namespace: office-gis
spec:
  selector:
    app: office-gis
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: office-gis-node
  namespace: office-gis
spec:
  type: NodePort
  selector:
    app: office-gis
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
